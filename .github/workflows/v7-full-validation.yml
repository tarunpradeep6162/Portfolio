name: V7 Full Validation

# Manual, nightly, or a specific release-candidate ref - never required to
# pass before a normal V7 commit merges (that's V7 Fast CI's job). Scoped
# entirely to operational-twin-v7 work; does not touch or reference V6's
# nightly.yml/release.yml.
on:
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Branch, tag, or commit to validate
        required: true
        default: operational-twin-v7
        type: string
  schedule:
    # 21:15 UTC = 02:45 IST (next day) - offset from V6's nightly.yml
    # (20:30 UTC) so the two don't contend for the same runner minute.
    - cron: "15 21 * * *"
  # TEMPORARY: GitHub will not accept API/CLI workflow_dispatch calls for a
  # workflow that has never fired - a documented GitHub limitation, not a
  # bug here. This push trigger exists only to register the workflow and
  # produce its first real run; removed again in the very next commit once
  # that's confirmed, restoring the manual/nightly-only design above.
  push:
    branches: [operational-twin-v7]

concurrency:
  group: v7-full-validation-${{ github.event.inputs.candidate_ref || 'operational-twin-v7' }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Checkout requested candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.candidate_ref || 'operational-twin-v7' }}

      - name: Resolve candidate SHA
        id: resolve
        run: |
          SHA="$(git rev-parse HEAD)"
          echo "Validating candidate ref '${{ github.event.inputs.candidate_ref || 'operational-twin-v7' }}' at commit $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "ref=${{ github.event.inputs.candidate_ref || 'operational-twin-v7' }}" >> "$GITHUB_OUTPUT"

  # Application-level validation: full Playwright suite, accessibility
  # audit, route/header audit, performance budget, canvas-before-intent -
  # all against a plain `npm start` server. Independent of docker-scan
  # below (neither needs the other's output), so they run in parallel on
  # separate runners.
  validate:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout candidate commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.setup.outputs.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Resolve installed Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium (+ OS deps only on a cache miss)
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:ci

      - name: Production build
        run: npm run build

      # No --grep: every test that exists, including the @release-fast-
      # tagged subset (tagging only marks a subset for V7 Fast CI, it
      # doesn't split the suite into two separate test sets). This is
      # where the full responsive matrix, every route's console scan, and
      # complete accessibility coverage actually run.
      - name: Complete Playwright suite
        run: npm run test:e2e -- --workers=1

      - name: Start production preview for audit/route/header/perf checks
        run: |
          nohup npm run start -- -p 3500 > /tmp/full-validation-server.log 2>&1 &
          echo $! > /tmp/full-validation-server.pid

      - name: Wait for server
        run: node scripts/ci/verify-health.mjs http://localhost:3500 60000

      - name: Structural / accessibility HTML audit
        run: V4_BASE_URL=http://localhost:3500 npm run audit:html

      - name: Verify routes
        run: node scripts/ci/verify-routes.mjs http://localhost:3500

      - name: Verify security headers
        run: node scripts/ci/verify-headers.mjs http://localhost:3500 /

      - name: Performance-budget measurement
        run: V6_BASE_URL=http://localhost:3500 node scripts/measure-v6-routes.mjs | tee /tmp/perf-routes.txt

      - name: Canvas-before-intent verification
        run: V6_BASE_URL=http://localhost:3500 node scripts/check-hero-canvas.mjs

      - name: Stop production preview
        if: always()
        run: node scripts/ci/cleanup.mjs --pid-file /tmp/full-validation-server.pid

      - name: Upload failure reports and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: v7-full-validation-traces
          path: |
            test-results/
            playwright-report/
            /tmp/full-validation-server.log
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v7-full-validation-perf
          path: /tmp/perf-routes.txt
          retention-days: 14
          if-no-files-found: ignore

  # Container-level validation: the actual production Docker image, not
  # just `npm start` - independent of validate above, runs in parallel.
  docker-scan-candidate:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout candidate commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.setup.outputs.sha }}

      - name: Trivy filesystem/secret/misconfig scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "0"
          format: table
          output: /tmp/trivy-fs-report.txt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build production image
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1 # v6.16.0
        with:
          context: .
          push: false
          load: true
          tags: tarun-portfolio:${{ needs.setup.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan (CRITICAL/HIGH, fixed vulnerabilities only)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: tarun-portfolio:${{ needs.setup.outputs.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Run candidate container
        run: |
          docker run -d --name v7-candidate -p 3600:3600 -e PORT=3600 \
            tarun-portfolio:${{ needs.setup.outputs.sha }}

      - name: Wait for candidate health
        run: node scripts/ci/verify-health.mjs http://localhost:3600 60000

      - name: Verify candidate routes (includes custom 404)
        run: node scripts/ci/verify-routes.mjs http://localhost:3600

      - name: Verify candidate security headers
        run: node scripts/ci/verify-headers.mjs http://localhost:3600 /

      - name: Stop candidate container
        if: always()
        run: docker rm -f v7-candidate || true

      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v7-full-validation-trivy
          path: /tmp/trivy-fs-report.txt
          retention-days: 14
          if-no-files-found: ignore
