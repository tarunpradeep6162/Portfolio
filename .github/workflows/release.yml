name: Release

# Two ways in:
#   1. Push the final version tag, e.g. living-infrastructure-v6-final -
#      the original, unchanged path. Promotion is attempted (subject to
#      VERCEL_PRODUCTION_URL being configured - see promote-and-smoke-test).
#   2. Manual workflow_dispatch with a candidate_ref - validates any
#      branch/tag/commit exactly the same way, with promotion controlled by
#      the explicit `promote` input (defaults to false). This is how a
#      release candidate gets validated on a real, uncontended GitHub-hosted
#      runner - Docker/Trivy verification that this VM's local contention
#      has repeatedly stalled - without needing a final tag pushed first.
# Candidate-first either way: build -> validate candidate -> promote, never
# a direct "deploy to production and hope" path.
on:
  push:
    tags:
      - "living-infrastructure-v*-final"
  workflow_dispatch:
    inputs:
      candidate_ref:
        description: Branch, tag, or commit to validate
        required: true
        default: living-infrastructure-v6
        type: string
      promote:
        description: Promote to production after validation
        required: true
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Resolves exactly what every other job validates and whether promotion
  # is even attempted, once, so every job checks out the identical pinned
  # commit rather than a possibly-moving branch ref, and none of them have
  # to re-derive the push-tag-vs-manual-dispatch distinction themselves.
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.resolve.outputs.ref }}
      sha: ${{ steps.resolve.outputs.sha }}
      promote: ${{ steps.resolve.outputs.promote }}
    steps:
      - name: Checkout requested candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.candidate_ref || github.ref }}

      - name: Resolve candidate SHA and promotion intent
        id: resolve
        run: |
          SHA="$(git rev-parse HEAD)"
          echo "Validating candidate ref '${{ github.event_name == 'workflow_dispatch' && inputs.candidate_ref || github.ref }}' at commit $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ref=${{ inputs.candidate_ref }}" >> "$GITHUB_OUTPUT"
            echo "promote=${{ inputs.promote }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ github.ref }}" >> "$GITHUB_OUTPUT"
            echo "promote=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Write candidate summary
        run: |
          echo "### Release candidate: \`${{ steps.resolve.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"

  validate:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout candidate commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.setup.outputs.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Full validation (lint, typecheck, unit, build)
        run: npm run verify

      - name: Start server for HTML audit
        # audit-static-html.mjs fetches http://127.0.0.1:3200 by default -
        # this step never started that server, so this job always failed
        # here on a real hosted run (a genuine workflow bug, found by
        # actually dispatching a release candidate, not caught by any
        # local check that always had a manually-started server already).
        run: |
          nohup npm run start -- -p 3200 > /tmp/audit-server.log 2>&1 &
          echo $! > /tmp/audit-server.pid
          node scripts/ci/verify-health.mjs http://localhost:3200 60000

      - name: HTML audit
        run: npm run audit:html

      - name: Stop HTML audit server
        if: always()
        run: node scripts/ci/cleanup.mjs --pid-file /tmp/audit-server.pid

      - name: Full Playwright suite (single worker)
        run: npm run test:e2e -- --workers=1

      - name: git diff --check
        run: git diff --check

  docker-image:
    needs: [setup, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout candidate commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.setup.outputs.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build production image (tagged by candidate commit SHA)
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1 # v6.16.0
        with:
          context: .
          push: false
          tags: tarun-portfolio:${{ needs.setup.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=docker,dest=/tmp/tarun-portfolio-image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: /tmp/tarun-portfolio-image.tar
          retention-days: 7

  image-scan:
    needs: [setup, docker-image]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.setup.outputs.sha }}

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load image
        run: docker load --input /tmp/tarun-portfolio-image.tar

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: tarun-portfolio:${{ needs.setup.outputs.sha }}
          severity: CRITICAL,HIGH
          # CRITICAL/HIGH with a known fix block; see docs/AUTOMATED_CI_CD.md
          # "Severity policy" for the documented exception process for
          # anything flagged without an available fix.
          ignore-unfixed: true
          exit-code: "1"
          format: table

  candidate-runtime-check:
    needs: [setup, docker-image]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout candidate commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.setup.outputs.sha }}

      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: docker-image
          path: /tmp

      - name: Load image
        run: docker load --input /tmp/tarun-portfolio-image.tar

      - name: Run candidate container
        run: |
          docker run -d --name release-candidate -p 3600:3600 -e PORT=3600 \
            tarun-portfolio:${{ needs.setup.outputs.sha }}

      - name: Wait for candidate health
        run: node scripts/ci/verify-health.mjs http://localhost:3600 60000

      - name: Verify candidate routes
        run: node scripts/ci/verify-routes.mjs http://localhost:3600

      - name: Verify candidate returns 404 for an unknown route
        run: |
          CODE=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3600/this-route-does-not-exist-release-check)
          if [ "$CODE" != "404" ]; then
            echo "::error::Expected 404 for an unknown route, got $CODE"
            exit 1
          fi
          echo "404 behaviour verified for an unknown route"

      - name: Verify candidate headers
        run: node scripts/ci/verify-headers.mjs http://localhost:3600 /

      - name: Stop candidate container
        if: always()
        run: docker rm -f release-candidate || true

  release-evidence:
    needs: [setup, validate, candidate-runtime-check]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout candidate commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.setup.outputs.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Production build
        run: npm run build

      - name: Start local candidate on release preview port
        run: |
          nohup npm run start -- -p 3500 > /tmp/release-server.log 2>&1 &
          echo $! > /tmp/release-server.pid
          node scripts/ci/verify-health.mjs http://localhost:3500 60000

      - name: Atlas interaction performance gate, reproduced twice
        run: |
          node scripts/measure-v6-performance.mjs /work/project-aurora | tee /tmp/release-perf-1.txt
          node scripts/measure-v6-performance.mjs /work/project-aurora | tee /tmp/release-perf-2.txt

      - name: Per-route performance budgets
        run: node scripts/measure-v6-routes.mjs | tee /tmp/release-perf-routes.txt

      - name: Screenshot matrix
        env:
          V6_SCREENSHOT_DIR: /tmp/v6-screenshots
        run: node scripts/capture-v6.mjs

      - name: Interaction video
        env:
          V6_VIDEO_DIR: /tmp/v6-video
        run: node scripts/record-v6-experience.mjs

      - name: Soak test (15 activation/deactivation cycles)
        run: node scripts/soak-test-v6.mjs | tee /tmp/release-soak.txt

      - name: Stop local candidate
        if: always()
        run: node scripts/ci/cleanup.mjs --pid-file /tmp/release-server.pid

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: |
            /tmp/release-perf-1.txt
            /tmp/release-perf-2.txt
            /tmp/release-perf-routes.txt
            /tmp/release-soak.txt
            /tmp/v6-screenshots/
            /tmp/v6-video/
            /tmp/release-server.log
          retention-days: 30
          if-no-files-found: ignore

  # Vercel's own Git integration is the deployment mechanism (see
  # docs/AUTOMATED_CI_CD.md) - this job only verifies a production
  # deployment took effect for this candidate's commit, using a token
  # supplied as a repository secret. It never runs if that secret isn't
  # configured, and never invents a URL. Gated on needs.setup.outputs.promote
  # so a workflow_dispatch candidate with promote=false (the default) never
  # even reaches the Vercel check - promotion stays impossible regardless of
  # whether every preceding job passed, not just skipped-with-a-warning.
  promote-and-smoke-test:
    needs: [setup, image-scan, release-evidence]
    if: needs.setup.outputs.promote == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - name: Checkout candidate commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.setup.outputs.sha }}

      - name: Check for Vercel configuration
        id: vercel-check
        run: |
          if [ -n "${{ secrets.VERCEL_PRODUCTION_URL }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::VERCEL_PRODUCTION_URL secret not set - production promotion/smoke-test skipped, not fabricated. See docs/AUTOMATED_CI_CD.md for the one-time setup."
          fi

      - name: Post-promotion smoke test
        if: steps.vercel-check.outputs.configured == 'true'
        run: |
          node scripts/ci/verify-health.mjs "${{ secrets.VERCEL_PRODUCTION_URL }}" 60000
          node scripts/ci/verify-routes.mjs "${{ secrets.VERCEL_PRODUCTION_URL }}"
          node scripts/ci/verify-headers.mjs "${{ secrets.VERCEL_PRODUCTION_URL }}" /

      - name: Write release summary
        if: always()
        run: |
          cat > /tmp/ci-status.json <<EOF
          {
            "commit": "${{ needs.setup.outputs.sha }}",
            "workflow": "Release",
            "status": "${{ job.status }}",
            "passedStages": ["setup", "validate", "docker-image", "image-scan", "candidate-runtime-check", "release-evidence"]
          }
          EOF
          node scripts/ci/create-summary.mjs /tmp/ci-status.json

      - name: Upload release CI summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-summary
          path: reports/ci-summary.md
          retention-days: 30
          if-no-files-found: ignore
