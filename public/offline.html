<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline - Tarun Pradeep</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu',
          'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
        background: #0f1419;
        color: #f5f1e8;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }
      .container {
        max-width: 600px;
        text-align: center;
      }
      h1 {
        font-size: 2.5rem;
        margin-bottom: 1rem;
        color: #d4af37;
      }
      p {
        font-size: 1.1rem;
        color: #a8a59f;
        margin-bottom: 2rem;
        line-height: 1.6;
      }
      a {
        display: inline-block;
        padding: 0.75rem 1.5rem;
        background: linear-gradient(to right, #d4af37, #b88a82);
        color: #0f1419;
        text-decoration: none;
        border-radius: 0.5rem;
        font-weight: 600;
        transition: transform 0.3s ease;
      }
      a:hover {
        transform: scale(1.05);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>You're Offline</h1>
      <p>
        It looks like you've lost your internet connection. This page is available offline, but
        other content requires an internet connection to load.
      </p>
      <a href="/">← Back Home</a>
    </div>
  </body>
</html>
