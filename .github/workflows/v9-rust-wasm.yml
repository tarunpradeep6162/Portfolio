name: V9 Rust/WASM (Mission Scenario Engine)

# Path-filtered per docs/PORTFOLIO_V9_IMPLEMENTATION_PLAN.md's polyglot
# addendum: a normal TypeScript-only commit against portfolio-v9 never
# triggers this job, only changes under crates/mission-simulator/ do.
# Full Validation (the release-gate workflow) always rebuilds this crate
# regardless of path filters - see that workflow for the unconditional
# rebuild.
on:
  push:
    branches: [portfolio-v9]
    paths:
      - "crates/mission-simulator/**"
      - ".github/workflows/v9-rust-wasm.yml"
  pull_request:
    branches: [portfolio-v9]
    paths:
      - "crates/mission-simulator/**"
      - ".github/workflows/v9-rust-wasm.yml"

concurrency:
  group: v9-rust-wasm-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust (stable + wasm32 target)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      # Cached independently of the npm/Go caches in v9-fast-ci.yml /
      # v9-go-audit.yml, keyed on this crate's own lockfile so a change in
      # one language's dependencies never invalidates another's cache.
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/mission-simulator/target
          key: cargo-mission-simulator-${{ runner.os }}-${{ hashFiles('crates/mission-simulator/Cargo.lock') }}
          restore-keys: |
            cargo-mission-simulator-${{ runner.os }}-

      - name: Run Rust unit tests (native target - the calculation logic itself)
        working-directory: crates/mission-simulator
        run: cargo test --locked

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked

      # apt's binaryen is too old to recognize the WASM features rustc
      # enables by default for wasm32-unknown-unknown; the npm binaryen
      # package ships a current wasm-opt binary instead.
      - name: Install a current wasm-opt (npm binaryen)
        run: |
          npm install --global binaryen
          echo "$(npm root -g)/binaryen/bin" >> "$GITHUB_PATH"

      - name: Build the WASM artifact
        working-directory: crates/mission-simulator
        run: wasm-pack build --target web --release --out-dir pkg

      # The integrity guarantee described in
      # docs/PORTFOLIO_V9_ARCHITECTURE.md: the committed pkg/ output is
      # only trustworthy because this job rebuilds it from the reviewed
      # Rust source on every relevant change and fails loudly on any
      # drift, rather than letting Vercel silently serve a stale artifact.
      - name: Verify the committed artifact matches this fresh rebuild
        run: |
          if ! git diff --quiet --exit-code -- crates/mission-simulator/pkg/mission_simulator_bg.wasm crates/mission-simulator/pkg/mission_simulator.js; then
            echo "::error::The rebuilt WASM artifact differs from the committed crates/mission-simulator/pkg/ output." >&2
            echo "::error::Rebuild locally (wasm-pack build --target web --release --out-dir pkg, from crates/mission-simulator/) and commit the result." >&2
            git diff --stat -- crates/mission-simulator/pkg/
            exit 1
          fi

      - name: Report compressed artifact size
        run: |
          size=$(gzip -9c crates/mission-simulator/pkg/mission_simulator_bg.wasm | wc -c)
          echo "Compressed (gzip -9) mission_simulator_bg.wasm: ${size} bytes"
          echo "### Mission Scenario Engine WASM size" >> "$GITHUB_STEP_SUMMARY"
          echo "Compressed (gzip -9): ${size} bytes" >> "$GITHUB_STEP_SUMMARY"
