[package]
name = "mission-simulator"
version = "0.1.0"
edition = "2021"
description = "Deterministic Mission Scenario Engine for Portfolio V9's Scenario Simulator - educational, client-side, never a claim about live infrastructure."
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Recent rustc enables WASM features (bulk-memory, sign-ext, etc.) by
# default for wasm32-unknown-unknown that older/default wasm-opt
# invocations don't recognize without being told about them explicitly.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O", "--all-features"]
