name: Nightly Deep Validation

# Schedule is UTC (GitHub Actions cron requirement). 20:30 UTC = 02:00 IST
# (next day) - chosen to run after the workday ends in IST without
# overlapping typical push activity. Also runnable on demand.
on:
  schedule:
    - cron: "30 20 * * *"
  workflow_dispatch: {}

concurrency:
  group: nightly-deep-validation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deep:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:ci

      - name: Production build
        run: npm run build

      - name: Full Playwright suite (single worker, this VM's proven isolation setting)
        run: npm run test:e2e -- --workers=1

      - name: Accessibility-focused pass
        run: npx playwright test tests/e2e/accessibility.spec.ts --workers=1

      - name: Start production preview for route/header/performance checks
        run: |
          nohup npm run start -- -p 3500 > /tmp/nightly-server.log 2>&1 &
          echo $! > /tmp/nightly-server.pid

      - name: Wait for server
        run: node scripts/ci/verify-health.mjs http://localhost:3500 60000

      - name: Verify routes
        run: node scripts/ci/verify-routes.mjs http://localhost:3500

      - name: Verify headers
        run: node scripts/ci/verify-headers.mjs http://localhost:3500 /

      - name: V6 Atlas interaction performance gate (reproduced twice)
        run: |
          node scripts/measure-v6-performance.mjs /work/project-aurora | tee /tmp/perf-run-1.txt
          node scripts/measure-v6-performance.mjs /work/project-aurora | tee /tmp/perf-run-2.txt

      - name: V6 per-route performance budgets
        run: node scripts/measure-v6-routes.mjs | tee /tmp/perf-routes.txt

      - name: V6 soak test (15 activation/deactivation cycles, real gate)
        run: node scripts/soak-test-v6.mjs | tee /tmp/soak-run.txt

      - name: Stop production preview
        if: always()
        run: node scripts/ci/cleanup.mjs --pid-file /tmp/nightly-server.pid

      - name: Trivy filesystem/secret/misconfig scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "0"
          format: table
          output: /tmp/trivy-fs-report.txt

      - name: Archive nightly reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-reports
          path: |
            /tmp/perf-run-1.txt
            /tmp/perf-run-2.txt
            /tmp/perf-routes.txt
            /tmp/soak-run.txt
            /tmp/trivy-fs-report.txt
            /tmp/nightly-server.log
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Write CI summary
        if: always()
        run: |
          STATUS="passed"
          if [ "${{ job.status }}" != "success" ]; then STATUS="failed"; fi
          cat > /tmp/ci-status.json <<EOF
          {
            "commit": "${{ github.sha }}",
            "workflow": "Nightly Deep Validation",
            "status": "$STATUS",
            "passedStages": ["lint", "typecheck", "unit", "build", "e2e-full", "accessibility", "routes", "headers", "performance", "soak", "trivy-fs"]
          }
          EOF
          node scripts/ci/create-summary.mjs /tmp/ci-status.json

      - name: Upload CI summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-summary
          path: reports/ci-summary.md
          retention-days: 7
          if-no-files-found: ignore
