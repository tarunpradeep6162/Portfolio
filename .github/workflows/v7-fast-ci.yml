name: V7 Fast CI

# Scoped to operational-twin-v7 only - this is a separate workflow from
# ci-fast.yml (which stays scoped to living-infrastructure-v6 and is not
# touched by this file), so V6's existing, already-verified CI behavior is
# never at risk of being changed by V7 work.
on:
  push:
    branches: [operational-twin-v7]
  pull_request:
    branches: [operational-twin-v7]

concurrency:
  group: v7-fast-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Independent of e2e-critical below - no `needs:`, both start immediately
  # and run on separate GitHub-hosted runners in parallel. This job alone
  # never needs a browser, so it stays lean.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Repository safety check (no secrets/large files staged)
        run: |
          if git ls-files | grep -E '^\.env($|\.)' ; then
            echo "::error::.env file(s) tracked in repository" >&2
            exit 1
          fi
          if git ls-files | grep -E '\.(pem|key)$|credentials\.json$'; then
            echo "::error::credential-shaped file(s) tracked in repository" >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (deterministic worker settings)
        run: npm run test:ci

      - name: Production build
        run: npm run build

  # Runs in parallel with validate, not after it - each job does its own
  # checkout/install/build since GitHub Actions jobs never share a
  # filesystem across runners; the redundant build is a deliberate
  # wall-clock trade (two ~1-2 minute builds running concurrently beats one
  # sequential validate-then-e2e chain).
  e2e-critical:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Playwright's own cache action keys on the exact resolved version in
      # package-lock.json (via `npm ls @playwright/test`) - a version bump
      # naturally invalidates this and re-downloads, so it never silently
      # tests against a stale/mismatched browser build.
      - name: Resolve installed Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium (+ OS deps only on a cache miss)
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" = "true" ]; then
            npx playwright install-deps chromium
          else
            npx playwright install --with-deps chromium
          fi

      - name: Production build
        run: npm run build

      # The complete, unfiltered suite (every test that exists, including
      # this same @release-fast set) only runs in V7 Full Validation -
      # this is deliberately the curated ~15-test release-critical slice,
      # tagged in the existing spec files (tests/e2e/*.spec.ts), covering:
      # home page loads with no console errors; nav + one representative
      # project route; custom 404; skip-link keyboard a11y; Operational
      # Twin activation, exactly one canvas while active, clean close back
      # to zero canvas; RC-01 activation; Atlas activation; one-canvas
      # mutual exclusion; zero canvas before intent; reduced-motion
      # fallback; 360px mobile overflow; a V7 RC-01 shared-state command;
      # Proof Ledger honesty; external identity links.
      - name: Critical Playwright smoke suite (@release-fast)
        run: npx playwright test --grep @release-fast --workers=1

      - name: Upload traces (failure only)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: v7-fast-ci-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
